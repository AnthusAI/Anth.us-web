name: Site build and deploy

# CI on GitHub, CD to AWS. A push to `main` builds the production site and
# uploads it to Amplify app AMPLIFY_APP_ID (branch `main`, manual-deployment
# mode). A push to `staging` builds the guarded variant (SITE_ENV unset) and
# uploads it to the `staging` Amplify branch. AWS auth is GitHub OIDC; there
# are no long-lived secrets. See README.md "Deployment".

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  AMPLIFY_APP_ID: AMPLIFY_APP_ID
  AWS_REGION: us-east-1
  # Keep in step with PAPYRUS_PIN in amplify.yml.
  PAPYRUS_PIN: c98435ff60763a3d3c9cb97837b74686fc95d55a

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      branch: ${{ steps.target.outputs.branch }}
    steps:
      - id: target
        run: |
          case "$GITHUB_REF_NAME" in
            main|staging) echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::only main and staging deploy (ref: $GITHUB_REF_NAME)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Papyrus is public. The build reads it as ../Papyrus (PAPYRUS_ROOT).
      - name: Check out Papyrus at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/AnthusAI/Papyrus.git ../Papyrus
          git -C ../Papyrus checkout --detach "$PAPYRUS_PIN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --quiet \
            "git+https://github.com/AnthusAI/Markus@v0.5.1" \
            "Pillow>=11.3,<12" "PyYAML>=6" "citeproc-py>=0.8.2,<1"

      # Image renditions take ~5 minutes cold; seconds warm.
      - uses: actions/cache@v4
        with:
          path: web/.image-cache
          key: image-cache-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: image-cache-

      - name: Site env tests
        run: python3 tests/test_site_env.py

      - name: Build (production)
        if: steps.target.outputs.branch == 'main'
        run: |
          rm -rf web/dist-papyrus web/staging
          PAPYRUS_ROOT="$GITHUB_WORKSPACE/../Papyrus" SITE_ENV=production AWS_BRANCH=main python3 web/build_via_papyrus.py
      - name: Build (guarded staging)
        if: steps.target.outputs.branch == 'staging'
        run: |
          rm -rf web/dist-papyrus web/staging
          PAPYRUS_ROOT="$GITHUB_WORKSPACE/../Papyrus" AWS_BRANCH=staging python3 web/build_via_papyrus.py

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: web/dist-papyrus
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Amplify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: amplify-${{ needs.build.outputs.branch }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      AMPLIFY_BRANCH: ${{ needs.build.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/AnthusPapyrusGitHubDeploy-${{ needs.build.outputs.branch }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload and start the Amplify deployment
        run: bash bin/deploy-amplify.sh site-dist

      # Read-only GETs against the deployed branch host.
      - name: Guard checks (production)
        if: env.AMPLIFY_BRANCH == 'main'
        run: |
          H="https://main.${AMPLIFY_APP_ID}.amplifyapp.com"
          python3 bin/check-guards.py "$H" --expect production
          python3 bin/check-404.py "$H"
      - name: Guard checks (staging)
        if: env.AMPLIFY_BRANCH == 'staging'
        run: |
          H="https://staging.${AMPLIFY_APP_ID}.amplifyapp.com"
          python3 bin/check-guards.py "$H" --expect guarded
          python3 bin/check-404.py "$H"
